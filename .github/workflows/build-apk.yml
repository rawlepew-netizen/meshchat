name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18

      - uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Install dependencies
        run: npm install

      - name: Add Capacitor Android platform
        run: npx cap add android

      - name: Copy native Kotlin files
        run: |
          PKG="android/app/src/main/java/com/bygrind/meshchat"
          mkdir -p "$PKG"
          cp native/MainActivity.kt "$PKG/"
          cp native/MeshService.kt "$PKG/"
          cp native/MeshPlugin.kt "$PKG/"

      - name: Replace AndroidManifest
        run: cp native/AndroidManifest.xml android/app/src/main/AndroidManifest.xml

      - name: Create file_paths.xml for FileProvider
        run: |
          mkdir -p android/app/src/main/res/xml
          cat > android/app/src/main/res/xml/file_paths.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <paths>
            <external-path name="external" path="."/>
            <files-path name="files" path="."/>
          </paths>
          EOF

      - name: Sync web assets
        run: npx cap sync android

      - name: Setup debug keystore
        run: |
          mkdir -p ~/.android
          keytool -genkeypair -v \
            -keystore ~/.android/debug.keystore \
            -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=Android Debug,O=Android,C=US" 2>/dev/null || true

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: meshchat-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
